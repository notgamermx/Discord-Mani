<!doctype html><html class="theme-dark"><head><meta charset="utf-8"><title>Server channel fixture</title></head><body>
<div id="app-mount">
  <div class="_a12-bg" style="position:fixed;inset:0;z-index:-1;background:linear-gradient(#070b20,#102e42)"></div>
  <div class="_a12-page" style="min-height:100vh;background:linear-gradient(#080f22,#14324c)">
    <header class="_a12-bar" style="padding:12px">Server channel</header>
    <div class="_a12-serverShell" style="display:flex;min-height:85vh;background:linear-gradient(#080f22,#14324c)">
      <aside class="_a12-sidebar" style="width:230px;padding:20px"><div class="_a12-sidebarList"><a href="#general" id="server-channel"># general</a></div></aside>
      <main class="_a12-chat" style="flex:1;padding:20px;background:#101b30">
        <section class="_a12-chatContent" style="background:linear-gradient(#080f22,#14324c)">
          <div class="_a12-chatGradient" style="background:linear-gradient(#080f22,#14324c);height:20px"></div>
          <div class="_a12-newMessagesWrapper" style="background:#112337;min-height:400px">
            <ol data-list-id="chat-messages"><li><div class="_a12-messageContent">Server messages remain readable.</div><div class="_a12-embedFull" style="padding:20px">Keep this embed solid.</div></li></ol>
          </div>
          <div class="_a12-channelTextArea" style="padding:15px"><button id="server-send">Composer button</button></div>
        </section>
      </main>
    </div>
  </div>
  <div id="server-dialog" role="dialog" style="background:#222;padding:20px">A solid dialog stays solid.</div>
</div></body></html>
